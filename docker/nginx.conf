# nginx de la imagen propia: corre como www-data, sin root

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;

	access_log /dev/stdout;

	# Rutas temporales escribibles por www-data
	client_body_temp_path /tmp/nginx/body;
	proxy_temp_path /tmp/nginx/proxy;
	fastcgi_temp_path /tmp/nginx/fastcgi;
	uwsgi_temp_path /tmp/nginx/uwsgi;
	scgi_temp_path /tmp/nginx/scgi;

	# Fotos de productos y recetas; igual que upload_max_filesize en php.ini
	client_max_body_size 50m;

	server {
		# Un usuario sin root no puede abrir el 80
		listen 8080;
		root /var/www/grocy/public;
		index index.php;

		location / {
			try_files $uri /index.php$is_args$query_string;
		}

		location ~ \.php$ {
			try_files $uri =404;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_pass 127.0.0.1:9000;
		}
	}
}
